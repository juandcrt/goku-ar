<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR con marcador (AR.js)</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
<style>body{margin:0;overflow:hidden}</style>
</head>
<body>
<!--
  Imprime o muestra en otra pantalla el marcador HIRO y apúntalo con la cámara.
  Marcador HIRO para imprimir: https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png

  ===== PARA PONER A GOKU =====
  Cambia el atributo gltf-model por tu modelo .glb de Goku.
  Opción fácil: pon goku.glb en esta carpeta y usa  gltf-model="goku.glb"
-->
<a-scene embedded vr-mode-ui="enabled: false"
         arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
  <a-marker preset="hiro">
    <a-entity
      gltf-model="personaje.glb"
      animation-mixer="clip: Caminar"
      scale="0.3 0.3 0.3"
      position="0 0 0"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
